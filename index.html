<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Une lettre pour vous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#14352d;--bg2:#06140f;
  --red:#b3242f;--red-dark:#86141f;--red-in:#5e0d16;
  --gold:#d8b46a;--gold-dark:#a8823b;
  --paper:#fbf6ea;--paper-back:#efe6d1;--ink:#3a2a1e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 75%) fixed;
  background-color:var(--bg2);
  color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,serif;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.scene{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  transition:opacity .9s ease,transform .9s ease;
}
.scene.gone{opacity:0;transform:translateY(50px) scale(.94);pointer-events:none}
.hint{
  font-family:'Great Vibes',cursive;color:var(--gold);
  font-size:clamp(28px,7vw,40px);
  animation:pulse 2.4s ease-in-out infinite;transition:opacity .4s;
}
.opened .hint{opacity:0}

.envelope{
  --ew:min(360px,84vw);
  position:relative;width:var(--ew);height:calc(var(--ew)*.64);
  cursor:pointer;perspective:1000px;outline:none;
  animation:float 4s ease-in-out infinite;
}
.opened .envelope{animation:none;cursor:default}
.env-back{position:absolute;inset:0;background:var(--red-in);border-radius:6px;box-shadow:0 24px 44px rgba(0,0,0,.5)}
.env-letter{
  position:absolute;left:6%;right:6%;top:6%;height:86%;z-index:2;
  background:var(--paper);border-radius:3px;padding:12% 12%;
  transition:transform 1.1s cubic-bezier(.3,.7,.3,1);
}
.env-letter span{display:block;height:3px;background:#e4d8bd;margin-bottom:11px;border-radius:2px}
.env-letter span:nth-child(1){width:45%;margin:0 auto 16px;background:#dcb9b9}
.env-letter span:nth-child(4){width:70%}
.out .env-letter{transform:translateY(-64%)}
.env-pocket{
  position:absolute;inset:0;z-index:3;border-radius:6px;
  background:linear-gradient(165deg,var(--red),var(--red-dark));
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);
}
.env-shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(0,0,0,.12)}
.env-shade.l{clip-path:polygon(0 0,50% 56%,0 100%)}
.env-shade.r{clip-path:polygon(100% 0,50% 56%,100% 100%);background:rgba(0,0,0,.18)}
.env-flap{
  position:absolute;left:0;right:0;top:0;height:60%;z-index:4;
  transform-origin:top center;
  transition:transform .9s cubic-bezier(.4,0,.2,1),z-index 0s .45s;
}
.env-flap::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,#c9333e,var(--red-dark));
  clip-path:polygon(0 0,100% 0,50% 100%);
}
.opened .env-flap{transform:rotateX(180deg);z-index:1}
.seal{
  position:absolute;left:50%;bottom:0;width:56px;height:56px;border-radius:50%;
  transform:translate(-50%,40%);
  background:radial-gradient(circle at 35% 30%,#f3d995,var(--gold) 45%,var(--gold-dark));
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.12),inset 0 -3px 6px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  color:#7d5a1f;font-size:24px;transition:opacity .3s;
}
.opened .seal{opacity:0}

.letter-stage{
  position:relative;z-index:2;min-height:100vh;
  display:none;align-items:center;justify-content:center;padding:48px 16px;
}
.letter-stage.show{display:flex}
.letter{
  position:relative;width:var(--lw);perspective:1800px;
  opacity:0;transform:translateY(40px) scale(.9);
  transition:opacity .7s ease,transform .9s cubic-bezier(.3,.7,.3,1);
  filter:drop-shadow(0 20px 34px rgba(0,0,0,.5));
}
.letter.in{opacity:1;transform:none}
.panel{position:relative;height:var(--ph);transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.55,0,.25,1)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.face.back{transform:rotateX(180deg);background:linear-gradient(180deg,var(--paper-back),#e6dbc2)}
.p0{transform-origin:50% 100%;transform:rotateX(-180deg);z-index:3}
.p1{z-index:1}
.p2{transform-origin:50% 0;transform:rotateX(180deg);z-index:2}
.p0 .face{border-radius:6px 6px 0 0}
.p2 .face{border-radius:0 0 6px 6px}
.letter.unfold-top .p0,.letter.unfold-bottom .p2{transform:rotateX(0deg)}
.p1 .face.front::after,.p2 .face.front::after{
  content:"";position:absolute;left:0;right:0;top:0;height:10px;
  background:linear-gradient(180deg,rgba(120,90,40,.10),transparent);pointer-events:none;
}

.content{
  position:absolute;left:0;width:var(--lw);
  padding:56px clamp(24px,7vw,60px) 52px;text-align:center;
  background:
    radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(225,205,160,.35),transparent 60%),
    var(--paper);
}
.content::before{
  content:"";position:absolute;inset:14px;border:1px solid rgba(216,180,106,.6);border-radius:4px;pointer-events:none;
}
.content h1{
  font-family:'Great Vibes',cursive;font-weight:400;color:var(--red);
  font-size:clamp(46px,11vw,66px);line-height:1.1;margin-bottom:6px;
}
.ornament{color:var(--gold-dark);letter-spacing:10px;font-size:16px;margin:4px 0 22px}
.content p{font-size:clamp(19px,4.6vw,22px);line-height:1.55;margin-bottom:14px}
.intro{text-align:justify;text-indent:1.5em;hyphens:auto}
.love{font-style:italic;margin:18px 0 0 !important}
.resto .desc{hyphens:auto}
.restos{display:grid;gap:14px;margin:18px 0 28px}
.resto{
  border:1px solid rgba(216,180,106,.75);border-radius:10px;padding:16px 18px 14px;
  background:rgba(255,255,255,.45);
}
.resto .num{font-family:'Great Vibes',cursive;color:var(--gold-dark);font-size:26px;line-height:1}
.resto h2{font-weight:600;font-size:clamp(22px,5.4vw,26px);color:var(--red-dark);margin:2px 0 4px}
.resto .desc{font-style:italic;font-size:18px;margin:0;color:#5b4634}
.reply{
  margin-top:8px;padding-top:20px;border-top:1px dashed rgba(168,130,59,.55);
  font-style:italic;
}
.sign{font-family:'Great Vibes',cursive;color:var(--red);font-size:clamp(32px,8vw,40px);margin-top:10px}

.measure{position:absolute;visibility:hidden;left:-9999px;top:0}

@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .envelope{animation:none}
  .hint{animation:none}
}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div class="scene" id="scene">
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Ouvrir l'enveloppe">
    <div class="env-back"></div>
    <div class="env-letter"><span></span><span></span><span></span><span></span></div>
    <div class="env-pocket"></div>
    <div class="env-shade l"></div>
    <div class="env-shade r"></div>
    <div class="env-flap"><div class="seal">&#10086;</div></div>
  </div>
  <div class="hint">Cliquez sur l'enveloppe</div>
</div>

<div class="letter-stage" id="stage">
  <div class="letter" id="letter"></div>
</div>

<template id="letter-content">
  <div class="content">
    <h1>Joyeux Noël&nbsp;!</h1>
    <div class="ornament">&#10022; &#10022; &#10022;</div>
    <p class="intro">Cette année, pour Noël, nous vous offrons un moment de convivialité en famille dans un endroit qui nous tient à cœur. Vous aurez le choix entre trois lieux bien différents.</p>
    <div class="restos">
      <div class="resto">
        <div class="num">I</div>
        <h2>Le Morimoto</h2>
        <p class="desc">Sous les lumières douces de la salle, les chefs travaillent le poisson avec une précision rare. Dans l’assiette, le Japon rencontre les plus beaux produits français, pour une cuisine à la fois élégante et surprenante.</p>
      </div>
      <div class="resto">
        <div class="num">II</div>
        <h2>Le Joki</h2>
        <p class="desc">Ici, la carte change au fil des mois, au rythme des producteurs du coin et des saisons. Chaque plat, ancré dans le terroir bordelais, arrive accompagné d’un cocktail pensé pour lui.</p>
      </div>
      <div class="resto">
        <div class="num">III</div>
        <h2>Le Blind</h2>
        <p class="desc">Ici, le vin se découvre à l’aveugle&nbsp;: on goûte, on devine, on se laisse surprendre. Dans l’assiette, une cuisine aux influences péruviennes, vive et colorée, du ceviche relevé aux plats à partager, qui s’accorde à chaque verre.</p>
      </div>
    </div>
    <p class="reply">Merci de nous répondre par message pour nous dire votre choix&nbsp;!</p>
    <p class="love">Avec tout notre amour,</p>
    <div class="sign">Clément et Pia</div>
  </div>
</template>

<script>
(() => {
  const scene = document.getElementById('scene');
  const envelope = document.getElementById('envelope');
  const stage = document.getElementById('stage');
  const letter = document.getElementById('letter');
  const tpl = document.getElementById('letter-content');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let opened = false;

  function build() {
    const lw = Math.min(560, window.innerWidth - 32);
    const measure = document.createElement('div');
    measure.className = 'measure';
    measure.style.setProperty('--lw', lw + 'px');
    const probe = tpl.content.firstElementChild.cloneNode(true);
    probe.style.position = 'relative';
    measure.appendChild(probe);
    document.body.appendChild(measure);
    const h = Math.ceil(probe.offsetHeight / 3) * 3;
    measure.remove();
    const ph = h / 3;
    letter.style.setProperty('--lw', lw + 'px');
    letter.style.setProperty('--ph', ph + 'px');
    letter.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const panel = document.createElement('div');
      panel.className = 'panel p' + i;
      const front = document.createElement('div');
      front.className = 'face front';
      const c = tpl.content.firstElementChild.cloneNode(true);
      c.style.top = (-i * ph) + 'px';
      c.style.height = h + 'px';
      if (i > 0) c.setAttribute('aria-hidden', 'true');
      front.appendChild(c);
      panel.appendChild(front);
      if (i !== 1) {
        const back = document.createElement('div');
        back.className = 'face back';
        panel.appendChild(back);
      }
      letter.appendChild(panel);
    }
    return ph;
  }

  function open() {
    if (opened) return;
    opened = true;
    const k = reduced ? 0.3 : 1;
    scene.classList.add('opened');
    setTimeout(() => scene.classList.add('out'), 750 * k);
    setTimeout(() => {
      scene.classList.add('gone');
      stage.classList.add('show');
      const ph = build();
      const top = letter.getBoundingClientRect().top + window.scrollY;
      window.scrollTo(0, Math.max(0, top + ph * 1.5 - window.innerHeight / 2));
      requestAnimationFrame(() => requestAnimationFrame(() => letter.classList.add('in')));
    }, 2000 * k);
    setTimeout(() => letter.classList.add('unfold-top'), 2800 * k);
    setTimeout(() => letter.classList.add('unfold-bottom'), 3600 * k);
    setTimeout(() => {
      scene.style.display = 'none';
      const top = letter.getBoundingClientRect().top + window.scrollY - 24;
      if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }, 4800 * k);
  }

  envelope.addEventListener('click', open);
  envelope.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });

  let rt;
  let lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (!stage.classList.contains('show') || window.innerWidth === lastW) return;
    clearTimeout(rt);
    rt = setTimeout(() => { lastW = window.innerWidth; build(); }, 150);
  });

  const cv = document.getElementById('snow');
  const ctx = cv.getContext('2d');
  let flakes = [], W = 0, H = 0, dpr = 1;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn(y) {
    return { x: Math.random() * W, y: y ?? Math.random() * H, r: Math.random() * 2.2 + .6,
             s: Math.random() * .6 + .25, d: Math.random() * Math.PI * 2, o: Math.random() * .5 + .35 };
  }
  size();
  const n = reduced ? 30 : Math.round(Math.min(110, W / 8));
  for (let i = 0; i < n; i++) flakes.push(spawn());
  window.addEventListener('resize', size);
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.d += .01;
      f.y += f.s * (reduced ? .4 : 1);
      f.x += Math.sin(f.d) * .35;
      if (f.y > H + 5) Object.assign(f, spawn(-5));
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${f.o})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
